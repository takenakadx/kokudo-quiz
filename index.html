<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国道クイズ - 指でなぞって覚える</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --blue: #2c5f9e;
    --blue-light: #4a90d9;
    --bg: #f4f7fb;
    --panel: #ffffff;
    --border: #dbe4f0;
    --text: #1a1a1a;
    --muted: #667;
    --green: #2e9e4f;
    --amber: #c98a11;
    --red: #d0473e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--blue);
    color: #fff;
    padding: 14px 16px 10px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }

  .tabs {
    display: flex;
    max-width: 720px;
    margin: 12px auto 0;
    padding: 0 12px;
    gap: 8px;
  }
  .tabs button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px 10px 0 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--blue-light);
    color: #fff;
    border-color: var(--blue-light);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 12px 32px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    padding: 14px;
  }
  [hidden] { display: none !important; }

  .map-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 62vh;
    background: #eaf1fb;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .leaflet-map { position: absolute; inset: 0; width: 100%; height: 100%; background: #eaf1fb; }
  .overlay-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    z-index: 500; /* Leafletのpane/controlより前面に出してポインター操作を横取りする */
  }
  .leaflet-tooltip.route-label {
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font: bold 11px sans-serif;
    color: #1a1a1a;
  }
  .leaflet-tooltip.route-label::before { display: none; }

  .map-mode-toggle {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 600; /* オーバーレイcanvas(500)より前面に出し、どちらのモードでも押せるようにする */
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--blue-light);
    background: #fff;
    color: var(--blue);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    touch-action: manipulation;
  }
  .map-mode-toggle.active {
    background: var(--blue-light);
    color: #fff;
  }

  .hwy-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .hwy-list button {
    padding: 8px 12px;
    min-height: 36px;
    border-radius: 999px;
    border: 1px solid var(--blue-light);
    background: #fff;
    color: var(--blue);
    font-size: 13px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .hwy-list button.active {
    background: var(--blue-light);
    color: #fff;
  }

  .info-box {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.7;
    background: #f0f7ff;
    border-left: 4px solid var(--blue-light);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
  }
  .info-box .pref { color: var(--muted); }

  .prompt-banner {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    background: #f0f7ff;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .prompt-banner .num { color: var(--blue); }
  .diff-badge { font-size: 12px; color: var(--amber); margin-left: 4px; vertical-align: middle; }

  .quiz-top-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .quiz-top-row .hwy-list { flex: 1; margin-bottom: 0; }
  .sound-toggle {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sound-toggle.muted { color: var(--muted); }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .controls button {
    flex: 1;
    min-width: 90px;
    min-height: 44px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--blue-light);
    background: #fff;
    color: var(--blue);
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .controls button.primary {
    background: var(--blue-light);
    color: #fff;
  }
  .controls button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .result {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .result.show { display: block; animation: resultPop 0.28s ease-out; }
  @keyframes resultPop {
    0% { transform: scale(0.92); opacity: 0; }
    60% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result.correct { background: #e9f8ee; border: 1px solid var(--green); color: #1d6b34; }
  .result.partial { background: #fdf5e3; border: 1px solid var(--amber); color: #8a6209; }
  .result.incorrect { background: #fdecea; border: 1px solid var(--red); color: #9c2f27; }

  .stats {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .hint-text {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
    min-height: 16px;
  }
  .ink-gauge-wrap { margin-bottom: 10px; }
  .ink-gauge-label {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
  .ink-gauge-track {
    height: 8px;
    border-radius: 999px;
    background: #e3ebf7;
    overflow: hidden;
  }
  .ink-gauge-fill {
    height: 100%;
    width: 100%;
    background: var(--blue-light);
    border-radius: 999px;
    transition: width 0.08s linear, background-color 0.2s;
  }
  .ink-gauge-fill.low { background: var(--red); }
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 16px 0 8px;
  }
</style>
</head>
<body>

<header>
  <h1>国道クイズ</h1>
  <p>国道がどこからどこまで続いているか、指でなぞって覚えよう</p>
</header>

<div class="tabs">
  <button id="tab-study" class="active">学習モード</button>
  <button id="tab-quiz">クイズモード</button>
</div>

<main>
  <!-- 学習モード -->
  <section id="panel-study" class="panel">
    <div class="hwy-list" id="study-hwy-list"></div>
    <div class="map-wrap">
      <div id="study-map" class="leaflet-map"></div>
    </div>
    <div class="info-box" id="study-info">左のボタンから国道を選んでください。</div>
    <div class="controls">
      <button id="study-replay">ルートをもう一度再生</button>
    </div>
  </section>

  <!-- クイズモード -->
  <section id="panel-quiz" class="panel" hidden>
    <div class="quiz-top-row">
      <div class="hwy-list" id="quiz-diff-list">
        <button data-diff="">すべて</button>
        <button data-diff="1">かんたん</button>
        <button data-diff="2">ふつう</button>
        <button data-diff="3">むずかしい</button>
      </div>
      <button class="sound-toggle" id="sound-toggle" aria-label="効果音の切り替え" title="効果音の切り替え">🔊</button>
    </div>
    <div class="prompt-banner" id="quiz-prompt">「クイズを始める」を押してください</div>
    <div class="ink-gauge-wrap" id="ink-gauge-wrap" hidden>
      <div class="ink-gauge-label">ペン残量 <span id="ink-gauge-pct">100%</span></div>
      <div class="ink-gauge-track"><div class="ink-gauge-fill" id="ink-gauge-fill"></div></div>
    </div>
    <div class="map-wrap">
      <div id="quiz-map" class="leaflet-map"></div>
      <canvas id="quiz-overlay" class="overlay-canvas"></canvas>
      <button id="map-mode-toggle" class="map-mode-toggle" type="button">🗺️ 地図を動かす</button>
    </div>
    <div class="hint-text" id="quiz-hint"></div>
    <div class="controls">
      <button id="quiz-start" class="primary">クイズを始める</button>
      <button id="quiz-hint-btn" disabled>ヒント（都市名を表示）</button>
      <button id="quiz-retry" disabled>もう一度なぞる</button>
      <button id="quiz-next" disabled>次の問題へ</button>
    </div>
    <div class="result" id="quiz-result"></div>
    <div class="stats" id="quiz-stats"></div>
  </section>
</main>

<footer>
  地図タイルは OpenStreetMap から読み込みます（インターネット接続が必要です）。成績等のデータは端末内(localStorage)にのみ保存され、外部サーバーへは送信されません。ルートは学習用に主要都市を結んだ簡略ルートです。
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="highways-data.js"></script>
<script>
"use strict";

const JAPAN_BOUNDS = [[24.0, 122.5], [45.9, 146.5]];

/* ---------- Leaflet地図の初期化 ----------
   学習モードは常にpan/zoom自由。クイズモードは「なぞる」操作と1本指ドラッグが
   衝突するため、既定ではpan/zoomを無効化し、モード切替ボタンで明示的に切り替える。 */
function createMap(containerId, interactive) {
  const map = L.map(containerId, {
    zoomControl: false,
    dragging: !!interactive,
    scrollWheelZoom: !!interactive,
    doubleClickZoom: !!interactive,
    boxZoom: !!interactive,
    keyboard: !!interactive,
    touchZoom: !!interactive,
    tap: false,
    attributionControl: true
  });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  map.fitBounds(JAPAN_BOUNDS, { padding: [4, 4], animate: false });
  return map;
}

function refitMap(map) {
  map.invalidateSize();
  map.fitBounds(JAPAN_BOUNDS, { padding: [4, 4], animate: false });
}

// dragging/zoom系ハンドラーは常に存在するので、生成時のオプションに関わらずいつでも有効/無効を切り替えられる
function setMapInteractive(map, enabled) {
  ["dragging", "scrollWheelZoom", "doubleClickZoom", "touchZoom", "boxZoom"].forEach(key => {
    if (map[key]) { enabled ? map[key].enable() : map[key].disable(); }
  });
}

function projectorFor(map) {
  return {
    project(lat, lng) {
      const p = map.latLngToContainerPoint([lat, lng]);
      return { x: p.x, y: p.y };
    }
  };
}

function makeCircleMarker(map, lat, lng, opts) {
  opts = opts || {};
  const marker = L.circleMarker([lat, lng], {
    radius: opts.r || 7,
    color: "#fff",
    weight: 2,
    fillColor: opts.color || "#2c5f9e",
    fillOpacity: 1
  });
  if (opts.label) {
    marker.bindTooltip(opts.label, { permanent: true, direction: "right", offset: [8, -4], className: "route-label" });
  }
  marker.addTo(map);
  return marker;
}

function makePolyline(map, waypoints, opts) {
  opts = opts || {};
  const latlngs = waypoints.map(w => [w[0], w[1]]);
  return L.polyline(latlngs, {
    color: opts.color || "#2e9e4f",
    weight: opts.width || 5,
    dashArray: opts.dashed ? "8 6" : null,
    lineCap: "round",
    lineJoin: "round"
  }).addTo(map);
}

/* ---------- なぞり判定用の幾何ヘルパー ---------- */
function distPointToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = a.x + dx * t, cy = a.y + dy * t;
  return Math.hypot(p.x - cx, p.y - cy);
}
function minDistToPath(p, path) {
  let min = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    min = Math.min(min, distPointToSeg(p, path[i], path[i + 1]));
  }
  if (path.length === 1) min = Math.hypot(p.x - path[0].x, p.y - path[0].y);
  return min;
}
function densify(points, step) {
  if (points.length < 2) return points.slice();
  const out = [points[0]];
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.floor(d / step));
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
  }
  return out;
}
function pathLength(points) {
  let len = 0;
  for (let i = 1; i < points.length; i++) len += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
  return len;
}

/* ================= 学習モード ================= */
const studyMap = createMap("study-map", true);
const studyLayerGroup = L.layerGroup().addTo(studyMap);
const studyList = document.getElementById("study-hwy-list");
const studyInfo = document.getElementById("study-info");
let studyHighway = null;
let studyAnimId = null;
let studyRouteLine = null;

HIGHWAYS.forEach(h => {
  const btn = document.createElement("button");
  btn.textContent = h.number;
  btn.addEventListener("click", () => selectStudyHighway(h, btn));
  studyList.appendChild(btn);
});

function selectStudyHighway(h, btn) {
  studyHighway = h;
  [...studyList.children].forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  studyInfo.innerHTML =
    `<strong>${h.number}</strong>：${h.startLabel} → ${h.endLabel}<br>` +
    `<span class="pref">通過：${h.prefectures.join(" → ")}</span><br>` +
    `${h.fact}`;
  renderStudy(h, true);
}

function renderStudy(h, animate) {
  studyLayerGroup.clearLayers();
  if (studyAnimId) cancelAnimationFrame(studyAnimId);
  if (!h) return;

  if (!animate) {
    makePolyline(studyLayerGroup, h.waypoints, { color: "#2e9e4f", width: 5 });
    h.waypoints.forEach((w, i) => {
      makeCircleMarker(studyLayerGroup, w[0], w[1], {
        color: i === 0 ? "#2c5f9e" : (i === h.waypoints.length - 1 ? "#d0473e" : "#2e9e4f"),
        r: i === 0 || i === h.waypoints.length - 1 ? 7 : 4,
        label: w[2]
      });
    });
    return;
  }

  makeCircleMarker(studyLayerGroup, h.waypoints[0][0], h.waypoints[0][1], { color: "#2c5f9e", r: 7, label: h.waypoints[0][2] });
  studyRouteLine = makePolyline(studyLayerGroup, [h.waypoints[0]], { color: "#2e9e4f", width: 5 });

  let step = 0;
  const totalSteps = 60;
  function frame() {
    const upToFloat = (step / totalSteps) * (h.waypoints.length - 1);
    const upToIdx = Math.floor(upToFloat);
    const partial = h.waypoints.slice(0, upToIdx + 1).map(w => [w[0], w[1]]);
    if (upToIdx < h.waypoints.length - 1) {
      const a = h.waypoints[upToIdx], b = h.waypoints[upToIdx + 1];
      const t = upToFloat - upToIdx;
      partial.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
    studyRouteLine.setLatLngs(partial);
    if (step >= totalSteps) {
      h.waypoints.forEach((w, i) => {
        if (i === 0) return;
        makeCircleMarker(studyLayerGroup, w[0], w[1], {
          color: i === h.waypoints.length - 1 ? "#d0473e" : "#2e9e4f",
          r: i === h.waypoints.length - 1 ? 7 : 4,
          label: w[2]
        });
      });
      return;
    }
    step++;
    studyAnimId = requestAnimationFrame(frame);
  }
  frame();
}

document.getElementById("study-replay").addEventListener("click", () => {
  if (studyHighway) renderStudy(studyHighway, true);
});

/* ================= クイズモード ================= */
const quizMap = createMap("quiz-map", false);
const quizLayerGroup = L.layerGroup().addTo(quizMap);
const quizProjector = projectorFor(quizMap);
const quizOverlay = document.getElementById("quiz-overlay");
const quizPrompt = document.getElementById("quiz-prompt");
const quizHintText = document.getElementById("quiz-hint");
const quizResult = document.getElementById("quiz-result");
const quizStatsEl = document.getElementById("quiz-stats");
const btnStart = document.getElementById("quiz-start");
const btnHint = document.getElementById("quiz-hint-btn");
const btnRetry = document.getElementById("quiz-retry");
const btnNext = document.getElementById("quiz-next");

/* ---- 地図の移動モード ⇔ なぞって答えるモード ----
   1本指ドラッグは「地図をpanする」操作と「なぞる」操作の両方の意味を持ちうるため、
   ボタンで明示的にモードを切り替える。移動モード中はオーバーレイcanvasを
   pointer-events:noneにしてLeafletへ操作を渡し、なぞるモードでは逆にする。 */
const mapModeToggleBtn = document.getElementById("map-mode-toggle");
let mapMoveMode = false;
function setMapMoveMode(enabled) {
  mapMoveMode = enabled;
  setMapInteractive(quizMap, enabled);
  quizOverlay.style.pointerEvents = enabled ? "none" : "auto";
  mapModeToggleBtn.textContent = enabled ? "✏️ なぞって答える" : "🗺️ 地図を動かす";
  mapModeToggleBtn.classList.toggle("active", enabled);
  if (enabled) {
    tracing = false;
    quizHintText.textContent = "地図を動かせます（ボタンを押すとなぞる操作に戻ります）";
  } else if (currentHighway) {
    quizHintText.textContent = "";
    updateOfficialDenseCache(); // pan/zoomで表示位置が変わっている可能性があるので再計算
    renderQuiz();
  }
}
mapModeToggleBtn.addEventListener("click", () => setMapMoveMode(!mapMoveMode));

let currentHighway = null;
let lastHighwayId = null;
let hintUsed = false;
let userPath = [];
let userOnRoute = [];
let officialDenseCache = [];
let traceTolerance = 0;
let tracing = false;
let answered = false;

// ペン幅（採点の許容範囲）を画面サイズに対する割合で決める。小さいほどシビアな判定・細いペンになる
const TOLERANCE_RATIO = 0.032;

/* ---- ペン残量（塗りつぶし対策） ---- */
const INK_BUDGET_RATIO = 1.2; // 実ルート長の何倍までなぞれるか
let routeLengthPx = 0;
let inkBudget = 0;
let drawnLength = 0;
let penEmpty = false;
const inkGaugeWrap = document.getElementById("ink-gauge-wrap");
const inkGaugeFill = document.getElementById("ink-gauge-fill");
const inkGaugePct = document.getElementById("ink-gauge-pct");
function renderInkGauge() {
  const remainRatio = inkBudget > 0 ? Math.max(0, 1 - drawnLength / inkBudget) : 1;
  inkGaugeFill.style.width = (remainRatio * 100) + "%";
  inkGaugePct.textContent = Math.round(remainRatio * 100) + "%";
  inkGaugeFill.classList.toggle("low", remainRatio < 0.2);
}

/* ---- 難易度フィルター ---- */
const DIFF_KEY = "kokudoQuizDifficulty.v1";
const DIFF_LABEL = { 1: "かんたん", 2: "ふつう", 3: "むずかしい" };
const diffListEl = document.getElementById("quiz-diff-list");

function loadDifficulty() {
  try {
    const v = localStorage.getItem(DIFF_KEY);
    return v ? Number(v) : null;
  } catch (e) { return null; }
}
function saveDifficulty(v) {
  try {
    if (v) localStorage.setItem(DIFF_KEY, String(v)); else localStorage.removeItem(DIFF_KEY);
  } catch (e) { /* ignore */ }
}
let selectedDifficulty = loadDifficulty();

function highlightDiffButtons() {
  [...diffListEl.children].forEach(b => {
    const v = b.dataset.diff ? Number(b.dataset.diff) : null;
    b.classList.toggle("active", v === selectedDifficulty);
  });
}
diffListEl.addEventListener("click", evt => {
  const btn = evt.target.closest("button");
  if (!btn) return;
  selectedDifficulty = btn.dataset.diff ? Number(btn.dataset.diff) : null;
  saveDifficulty(selectedDifficulty);
  highlightDiffButtons();
});
highlightDiffButtons();

function diffStars(level) {
  const filled = "★".repeat(level);
  const empty = "☆".repeat(3 - level);
  return ` <span class="diff-badge" title="${DIFF_LABEL[level]}">${filled}${empty}</span>`;
}

/* ---- 効果音（Web Audio APIで簡易生成。音声ファイルは使わない） ---- */
const SOUND_KEY = "kokudoQuizSoundEnabled.v1";
const soundToggleBtn = document.getElementById("sound-toggle");
let soundEnabled = true;
try {
  const v = localStorage.getItem(SOUND_KEY);
  if (v !== null) soundEnabled = v === "1";
} catch (e) { /* ignore */ }

let audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  return audioCtx;
}
function playTone(freqs, duration) {
  if (!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = f;
    const start = ctx.currentTime + i * duration * 0.9;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.15, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration);
  });
}
function playCorrectSound() { playTone([523.25, 659.25, 783.99], 0.14); }
function playPartialSound() { playTone([440, 392], 0.16); }
function playIncorrectSound() { playTone([220, 174.6], 0.2); }

function renderSoundToggle() {
  soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
  soundToggleBtn.classList.toggle("muted", !soundEnabled);
}
soundToggleBtn.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem(SOUND_KEY, soundEnabled ? "1" : "0"); } catch (e) { /* ignore */ }
  renderSoundToggle();
  if (soundEnabled) playTone([659.25], 0.1);
});
renderSoundToggle();

const STATS_KEY = "kokudoQuizStats.v1";
function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { total: 0, correct: 0, byHighway: {} }; }
  catch (e) { return { total: 0, correct: 0, byHighway: {} }; }
}
function saveStats(s) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
}
function renderStats() {
  const s = loadStats();
  const rate = s.total ? Math.round((s.correct / s.total) * 100) : 0;
  quizStatsEl.textContent = `正解 ${s.correct} / 出題 ${s.total}（正解率 ${rate}%）`;
}
renderStats();

function pickHighway() {
  const pool = selectedDifficulty ? HIGHWAYS.filter(h => h.difficulty === selectedDifficulty) : HIGHWAYS;
  const list = pool.length ? pool : HIGHWAYS;
  let h;
  do { h = list[Math.floor(Math.random() * list.length)]; }
  while (list.length > 1 && h.id === lastHighwayId);
  lastHighwayId = h.id;
  return h;
}

function setupOverlay() {
  const dpr = window.devicePixelRatio || 1;
  const rect = quizOverlay.parentElement.getBoundingClientRect();
  quizOverlay.width = Math.round(rect.width * dpr);
  quizOverlay.height = Math.round(rect.height * dpr);
  const ctx = quizOverlay.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, width: rect.width, height: rect.height };
}

// 起点・終点の都市名は、ヒントを使うか回答するまでは隠す（地図上の始点マーカーだけが手がかり）
function renderQuizPrompt() {
  const showRoute = hintUsed || answered;
  const routeText = showRoute ? `：${currentHighway.startLabel} → ${currentHighway.endLabel}` : "";
  quizPrompt.innerHTML = `<span class="num">${currentHighway.number}</span>${diffStars(currentHighway.difficulty)}${routeText}`;
}

function startQuestion() {
  currentHighway = pickHighway();
  hintUsed = false;
  userPath = [];
  userOnRoute = [];
  drawnLength = 0;
  penEmpty = false;
  answered = false;
  quizLayerGroup.clearLayers();
  quizResult.className = "result";
  quizResult.textContent = "";
  quizHintText.textContent = "";
  btnHint.disabled = false;
  btnRetry.disabled = true;
  btnNext.disabled = true;
  renderQuizPrompt();
  refitMap(quizMap); // pan/zoomしていた場合も、毎回同じ構図(日本全体)からスタートする
  makeCircleMarker(quizLayerGroup, currentHighway.waypoints[0][0], currentHighway.waypoints[0][1], { color: "#2c5f9e", r: 8 });
  setMapMoveMode(false); // なぞるモードに戻す（内部でofficialDenseCacheの再計算・再描画も行う）
  inkGaugeWrap.hidden = false;
  renderInkGauge();
}

// なぞっている最中にリアルタイムで逸脱チェック・ペン残量計算をするための下ごしらえ（地図のサイズが変わったら呼び直す）
function updateOfficialDenseCache() {
  if (!currentHighway) { officialDenseCache = []; routeLengthPx = 0; inkBudget = 0; return; }
  const officialPts = currentHighway.waypoints.map(w => quizProjector.project(w[0], w[1]));
  officialDenseCache = densify(officialPts, 6);
  const rect = quizOverlay.parentElement.getBoundingClientRect();
  traceTolerance = Math.min(rect.width, rect.height) * TOLERANCE_RATIO;
  routeLengthPx = pathLength(officialPts);
  inkBudget = routeLengthPx * INK_BUDGET_RATIO;
}

function showEndMarker() {
  const h = currentHighway;
  const last = h.waypoints[h.waypoints.length - 1];
  makeCircleMarker(quizLayerGroup, last[0], last[1], { color: "#d0473e", r: 8 });
}

function renderQuiz() {
  const { ctx, width, height } = setupOverlay();
  ctx.clearRect(0, 0, width, height);
  if (userPath.length > 1) {
    ctx.save();
    // ペンの実際の太さ（採点で「ルートが含まれるか」を判定する幅と同じ）を半透明の帯として見せる
    ctx.lineWidth = Math.max(6, traceTolerance * 2);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalAlpha = 0.35;
    let i = 1;
    while (i < userPath.length) {
      const onRoute = userOnRoute[i] !== false;
      ctx.strokeStyle = onRoute ? "#2c5f9e" : "#d0473e";
      ctx.beginPath();
      ctx.moveTo(userPath[i - 1].x, userPath[i - 1].y);
      let j = i;
      while (j < userPath.length && (userOnRoute[j] !== false) === onRoute) {
        ctx.lineTo(userPath[j].x, userPath[j].y);
        j++;
      }
      ctx.stroke();
      i = j;
    }
    // 軌跡の芯（実際に指が通った位置）を細い線で重ねて見やすくする
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#1a3a63";
    ctx.beginPath();
    userPath.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.stroke();
    ctx.restore();
  }
}

const GRADE_CORRECT = 80;
const GRADE_PARTIAL = 50;

// 採点：なぞった軌跡を「太さのあるペンで塗った帯」とみなし、実ルートがどれだけその帯に
// 含まれるか（カバー率）だけをスコアとする。ペン長は開始時に実ルート長の120%に制限済みなので、
// 塗りつぶして稼ぐことができず、従来の「軌跡が経路上にあるか(accuracy)」の別判定は不要になる。
function scoreAttempt() {
  const h = currentHighway;
  const officialPts = h.waypoints.map(w => quizProjector.project(w[0], w[1]));
  const rect = quizOverlay.parentElement.getBoundingClientRect();
  const tolerance = Math.min(rect.width, rect.height) * TOLERANCE_RATIO;
  const officialDense = densify(officialPts, 6);
  const userDense = densify(userPath, 6);

  let covered = 0;
  officialDense.forEach(p => { if (minDistToPath(p, userDense.length ? userDense : [p]) <= tolerance) covered++; });
  const coverage = officialDense.length ? covered / officialDense.length : 0;

  // まず生スコア（ヒント補正前）で合否を判定してから、ヒントのペナルティを適用する。
  // 生スコアを直接0.5倍してから判定すると、網羅率95%のような好成績でもヒント使用時に
  // しきい値をまたいで「もう少し」まで落ちてしまうため、判定と表示スコアの補正を分離する。
  const rawScore = Math.round(coverage * 100);
  let grade = "incorrect";
  if (rawScore >= GRADE_CORRECT) grade = "correct";
  else if (rawScore >= GRADE_PARTIAL) grade = "partial";

  let score = rawScore;
  if (hintUsed) {
    if (grade === "correct") grade = "partial"; // ヒントを使うと「正解」判定にはならない
    score = Math.round(rawScore * 0.5); // 表示スコアはペナルティとして半分にする
  }

  return { score, coverage, grade };
}

function finishAttempt() {
  const result = scoreAttempt();
  answered = true;
  quizHintText.textContent = "";
  showEndMarker();
  makePolyline(quizLayerGroup, currentHighway.waypoints, { color: "#2e9e4f", width: 4, dashed: true });
  renderQuizPrompt();
  renderQuiz();
  if (result.grade === "correct") playCorrectSound();
  else if (result.grade === "partial") playPartialSound();
  else playIncorrectSound();

  const s = loadStats();
  s.total++;
  if (result.grade === "correct") s.correct++;
  const hs = s.byHighway[currentHighway.id] || { attempts: 0, correct: 0 };
  hs.attempts++;
  if (result.grade === "correct") hs.correct++;
  s.byHighway[currentHighway.id] = hs;
  saveStats(s);
  renderStats();

  quizResult.className = "result show " + result.grade;
  const pct = result.score;
  const penNote = penEmpty ? "（ペンが途中でなくなりました）" : "";
  if (result.grade === "correct") {
    quizResult.innerHTML = `<strong>正解！</strong>（ルート網羅率 ${pct}%）<br>${currentHighway.number} は ${currentHighway.startLabel} から ${currentHighway.prefectures.slice(1).join("→")} を通り ${currentHighway.endLabel} へ。<br>${currentHighway.fact}`;
  } else if (result.grade === "partial") {
    quizResult.innerHTML = `<strong>惜しい！</strong>（ルート網羅率 ${pct}%）${penNote}実際のルート（緑の点線）と見比べてみましょう。`;
  } else {
    quizResult.innerHTML = `<strong>もう少し！</strong>（ルート網羅率 ${pct}%）${penNote}実際のルート（緑の点線）を確認して、もう一度挑戦してみましょう。`;
  }
  btnHint.disabled = true;
  btnRetry.disabled = false;
  btnNext.disabled = false;
}

/* ---- ポインター操作 ---- */
function getLocalPos(evt) {
  const rect = quizOverlay.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

quizOverlay.addEventListener("pointerdown", evt => {
  if (!currentHighway || answered || mapMoveMode) return;
  const pos = getLocalPos(evt);
  const start = quizProjector.project(currentHighway.waypoints[0][0], currentHighway.waypoints[0][1]);
  const rect = quizOverlay.getBoundingClientRect();
  const tolerance = Math.min(rect.width, rect.height) * 0.09;
  if (Math.hypot(pos.x - start.x, pos.y - start.y) > tolerance) {
    quizHintText.textContent = "青い始点マーカーからなぞり始めてください";
    return;
  }
  tracing = true;
  userPath = [pos];
  userOnRoute = [true];
  quizHintText.textContent = "";
  quizOverlay.setPointerCapture(evt.pointerId);
  renderQuiz();
});
quizOverlay.addEventListener("pointermove", evt => {
  if (!tracing || penEmpty) return;
  const pos = getLocalPos(evt);
  const last = userPath[userPath.length - 1];
  const segDist = Math.hypot(pos.x - last.x, pos.y - last.y);
  let finalPos = pos;
  if (drawnLength + segDist >= inkBudget) {
    const remain = Math.max(0, inkBudget - drawnLength);
    const t = segDist > 0 ? remain / segDist : 0;
    finalPos = { x: last.x + (pos.x - last.x) * t, y: last.y + (pos.y - last.y) * t };
    drawnLength = inkBudget;
    penEmpty = true;
  } else {
    drawnLength += segDist;
  }
  userPath.push(finalPos);
  const onRoute = officialDenseCache.length ? minDistToPath(finalPos, officialDenseCache) <= traceTolerance : true;
  userOnRoute.push(onRoute);
  quizHintText.textContent = penEmpty ? "ペンがなくなりました。指を離すと採点されます" : (onRoute ? "" : "ルートから外れています…");
  renderInkGauge();
  renderQuiz();
});
function endTrace(evt) {
  if (!tracing) return;
  tracing = false;
  if (userPath.length < 2) { userPath = []; renderQuiz(); return; }
  finishAttempt();
}
quizOverlay.addEventListener("pointerup", endTrace);
quizOverlay.addEventListener("pointercancel", endTrace);

btnStart.addEventListener("click", () => {
  btnStart.textContent = "別の国道で挑戦";
  startQuestion();
});
btnHint.addEventListener("click", () => {
  hintUsed = true;
  btnHint.disabled = true;
  quizHintText.textContent = "都市名と終点を表示しました（「正解」判定にはならず、スコアも半分になります）";
  showEndMarker();
  renderQuizPrompt();
});
btnRetry.addEventListener("click", () => {
  userPath = [];
  userOnRoute = [];
  drawnLength = 0;
  penEmpty = false;
  answered = false;
  quizResult.className = "result";
  quizResult.textContent = "";
  btnRetry.disabled = true;
  btnNext.disabled = true;
  refitMap(quizMap); // pan/zoomしていた場合に備えて表示を戻す
  setMapMoveMode(false);
  renderInkGauge();
});
btnNext.addEventListener("click", startQuestion);

/* ================= タブ切替 ================= */
const tabStudy = document.getElementById("tab-study");
const tabQuiz = document.getElementById("tab-quiz");
const panelStudy = document.getElementById("panel-study");
const panelQuiz = document.getElementById("panel-quiz");
tabStudy.addEventListener("click", () => {
  tabStudy.classList.add("active"); tabQuiz.classList.remove("active");
  panelStudy.hidden = false; panelQuiz.hidden = true;
  refitMap(studyMap);
  if (studyHighway) renderStudy(studyHighway, false);
});
tabQuiz.addEventListener("click", () => {
  tabQuiz.classList.add("active"); tabStudy.classList.remove("active");
  panelQuiz.hidden = false; panelStudy.hidden = true;
  refitMap(quizMap);
  if (currentHighway) { updateOfficialDenseCache(); renderQuiz(); }
});

/* ================= リサイズ対応 ================= */
window.addEventListener("resize", () => {
  if (!panelStudy.hidden) refitMap(studyMap);
  if (!panelQuiz.hidden) {
    refitMap(quizMap);
    if (currentHighway) { updateOfficialDenseCache(); renderQuiz(); }
  }
});

/* 初期表示 */
selectStudyHighway(HIGHWAYS[0], studyList.children[0]);
</script>
